name: Build Mix2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;4.1.2" || sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses || true
      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk -name "*.apk" -print -exec cp {} dist/ \;
          ls -la dist
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-mix2-apk
          path: dist/*.apk
