name: Build Mix2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1)
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "ndk;30.0.16248370" "cmake;4.1.2" || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" "build-tools;37.0.0-rc1" "build-tools;37.0.0-rc4" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" || true
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --list_installed || true
      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          ORG_GRADLE_PROJECT_org.gradle.workers.max: "2"
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        if: always()
        run: |
          mkdir -p dist
          find . -path "*build/outputs/apk*/*.apk" -print -exec cp {} dist/ \; || true
          ls -la dist || true
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-mix2-apk
          path: dist/*.apk
          if-no-files-found: warn
